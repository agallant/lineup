name: Auto-Merge PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# gh pr merge needs write access; the default token is often read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    # Only run on PRs targeting main
    if: github.base_ref == 'main'
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Squash only (the main ruleset allows nothing else). Auto-merge waits for the
        # required checks (CI, CodeRabbit, CodeQL) and resolved conversations.
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
