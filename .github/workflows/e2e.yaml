# Lineup's own checks on top of the template's CI: the build stays path-independent and within
# its size budget (check:dist), and the built app works end to end in headless Chromium (real
# AudioWorklet, clock, canvas; fake microphone). Playwright comes from the lockfile; only its
# browser is downloaded here.
name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist:
    name: Dist check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - run: npm run build
      - run: npm run check:dist

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
