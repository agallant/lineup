# Dependabot version updates. Security updates (PRs for vulnerable dependencies) are a repo
# setting and need nothing here.
#
# Dependabot PRs go through the same gates as any other PR. A daily scheduled Claude session gets
# each one reviewed and turns on auto-merge (see "Dependabot PRs" in CLAUDE.md).
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/ current (the "# vX.Y.Z" comments are updated too).
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    # Let new releases age a week before adopting them (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # App dependencies (package-lock.json, all workspaces).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: deps
